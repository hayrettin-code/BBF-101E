<!DOCTYPE html>
<meta charset="utf-8">

<html>
    <head>
        <title> FORM </title>
    </head>

    <body>
        <script>
        

            function formSubmitted(event) {
                event.preventDefault();

                let studentIDControl = checkStudentID();
                let ageControl = checkAge();
                let nameControl = checkName();

                console.log("Student ID Check Result: " + studentIDControl);
                if(nameControl == 1){
                    alert("Name must be filled!");
                }else if(ageControl == 1){
                    alert("Age and birthdate do not match!");
                }else if(studentIDControl == 1){
                    alert("Student ID must be 9 digits!");
                }else if(studentIDControl == 2){
                    alert("Student ID must be only numbers!");
                }else {
                    let today = new Date();
                    alert("Form submitted successfully! Date: " + today.getDate() + "/" + (today.getMonth()+1) + "/" + today.getFullYear());
                }
                
            }
            function checkName(){
                console.log("Name is being checked.");
                let name = document.getElementById("name");
                let nameValue = name.value;
                if(nameValue == ""){
                    return 1;
                }else return 0;

            }
            
            function checkAge(){
                console.log("Age is being checked.");
                age = document.getElementById("age");
                birthdate = document.getElementById("birthdate");
                let ageValue = parseInt(age.value);
                let birthdateValue = birthdate.value;
                let birthYear = new Date(birthdateValue).getFullYear();
                let currentYear = new Date().getFullYear();
                let controlAge = currentYear - birthYear;
                if(controlAge != ageValue){
                    return 1;
                } else return 0;

            }
            function checkStudentID() {
                   console.log("Student ID is being checked.");
                   studentID = document.getElementById("id").value;
                   if(studentID.length != 9){
                      return 1;
                   } else if (isNaN(studentID)){
                      return 2;
                   } else return 0;
            }
            

            
        </script>
        
        
        <form id="formID" onsubmit="formSubmitted(event)">
        <fieldset>
            <legend> FORM </legend>
            <div>
                <label for="name"> Name & Surname </label>
                <input placeholder="Username" id="name">
            </div>
            <div>
                <label for="id"> Student ID </label>
                <input placeholder="Student ID" id="id">
            </div>
            <div>
                <label for="age"> Age </label>
                <input type="number" name="age" value="0" id="age">
            </div>
            <div>
                <label for="email"> Email </label>
                <input type="email" id="email">
            </div>
            <div>
                <label for="birthdate"> Birthdate </label>
                <input type="date" id="birthdate">
            </div>
            <div>
                <label for="password"> Password </label>
                <input type="password" placeholder="Password" id="password">
            </div>

            <div>
                <label for="wellcheck"> I read the assignment description well. </label>
                <input type="checkbox">
            </div>
            <div>
                <label for="askcheck"> I asked my friends to what to do. </label>
                <input type="checkbox" id="askcheck">
            </div>
            <div>
                <label for="wellradio"> I read the assignment description. </label>
                <input type="radio" name="read" id="wellradio"> 
            </div>
            <div>
                <label for="askradio"> I asked my friends to what to do. </label>
                <input type="radio" name="read" id="askradio"> 
            </div>
            <div>
                <label for="others"> Others </label>
                <textarea id="others"></textarea>
            </div>
            <button type="reset"> Reset </button>
            <button type="submit"> Submit </button>
        </fieldset>
        </form>
    </body>
</html>
